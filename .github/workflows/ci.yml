name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --group dev --group docs
      - run: uv run ruff check src tests examples web
      - run: uv run pytest -q
      - run: uv run mkdocs build --strict
  web:  # the browser engine: its types follow chunkmirage's schema (tests/test_schema.py keeps that current)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen && git diff --exit-code src/generated
      - run: npm run check
