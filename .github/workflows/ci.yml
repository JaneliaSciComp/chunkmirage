name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --group dev --group docs
      - run: uv run ruff check src tests examples
      - run: uv run pytest -q
      - run: uv run mkdocs build --strict
