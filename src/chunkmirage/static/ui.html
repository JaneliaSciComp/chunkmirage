<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chunkmirage control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --fg:#e6e6e6; --muted:#8b93a7; --accent:#2dd4bf; --line:#2a2f3a; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:12px 18px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; letter-spacing:.3px; }
  header .status { color:var(--muted); font-size:12px; }
  main { padding:16px 18px; display:grid; gap:16px; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
  .card h2 { margin:0 0 6px; font-size:15px; display:flex; justify-content:space-between; align-items:baseline; }
  .card h2 small { color:var(--muted); font-weight:normal; font-size:12px; }
  .src { color:var(--muted); font-size:12px; word-break:break-all; margin-bottom:10px; }
  .op { border-top:1px solid var(--line); padding:8px 0; }
  .op .head { display:flex; justify-content:space-between; align-items:center; }
  .op .head b { color:var(--accent); }
  .param { display:grid; grid-template-columns: 90px 1fr 84px; gap:8px; align-items:center; margin:6px 0 2px; }
  .param label { color:var(--fg); font-size:12px; }
  .desc { grid-column: 1 / -1; color:var(--muted); font-size:11.5px; line-height:1.35; margin:-2px 0 6px; }
  .opdoc { color:var(--muted); font-size:12px; margin:2px 0 4px; }
  input[type=range] { width:100%; }
  input[type=number], input[type=text], select { background:#0c0e12; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:3px 6px; font:inherit; }
  input[type=number] { width:76px; }
  button { background:#232838; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 10px; cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); color:#04262a; border-color:transparent; font-weight:600; }
  button:hover { filter:brightness(1.1); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .hint { color:var(--muted); font-size:12px; }
  .digest { font-family: ui-monospace, monospace; font-size:11px; color:var(--muted); }
  .viewer { grid-column: 1 / -1; }
  .viewer iframe { width:100%; height:70vh; border:1px solid var(--line); border-radius:6px; background:#000; margin-top:10px; }
  .warn { color:#f5b544; font-size:12px; }
  code { background:#0c0e12; padding:1px 4px; border-radius:3px; font-size:12px; }
  textarea.code { width:100%; box-sizing:border-box; min-height:15em; resize:vertical; background:#0c0e12; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:6px 8px; font:12px/1.45 ui-monospace, monospace; tab-size:4; }
  .codeerr { color:#f87171; font:12px/1.4 ui-monospace, monospace; white-space:pre-wrap; margin:4px 0; }
</style>
</head>
<body>
<header>
  <h1>chunkmirage</h1>
  <span class="status" id="status">connecting…</span>
</header>
<main id="main">
  <section class="card viewer">
    <h2>Viewer <small>embedded here, or opened in a new tab</small></h2>
    <div class="row">
      <label class="hint">show</label>
      <select id="viewerKind">
        <option value="appspot">neuroglancer-demo.appspot.com</option>
        <option value="python" id="pythonOpt" disabled>python viewer (not running)</option>
        <option value="custom">custom viewer URL…</option>
      </select>
      <input type="text" id="viewerUrl" size="40" value="https://neuroglancer-demo.appspot.com" style="display:none">
      <label class="hint">format</label>
      <select id="format"></select>
      <button class="primary" id="openViewer">Open in new tab</button>
      <label class="hint"><input type="checkbox" id="autoPush" checked> push updates to the viewer</label>
      <label class="hint"><input type="checkbox" id="embed" checked> embed</label>
    </div>
    <p class="hint" id="viewerHint"></p>
    <!-- allow: a public https viewer (appspot) fetching from a private 10.x address needs
         Chrome's Local Network Access permission, which the embedding page must delegate. -->
    <iframe id="ngFrame" allow="fullscreen; local-network-access *" style="display:none"></iframe>
  </section>
</main>
<script>
const $ = (s, el=document) => el.querySelector(s);
let OPS = {}, DATASETS = {}, FORMATS = [], ngWin = null, timers = {};
// a server started with --token: the token this page was opened with (/ui?token=...), sent on
const TOKEN = new URLSearchParams(location.search).get('token');
const api = (url, opts = {}) => fetch(url, TOKEN ? {...opts, headers: {...(opts.headers || {}), authorization: `Bearer ${TOKEN}`}} : opts);
const status = m => { $('#status').textContent = m; };

async function load() {
  const [idx, ops] = await Promise.all([fetch('./').then(r=>r.json()), api('api/ops').then(r=>r.json())]);
  OPS = ops; DATASETS = idx.datasets; FORMATS = idx.formats;
  const fsel = $('#format');
  const first = !fsel.options.length;
  if (first) for (const f of FORMATS) { const o = document.createElement('option'); o.value = o.textContent = f; if (f==='zarr3') o.selected = true; fsel.appendChild(o); }
  VIEWER_URL = idx.viewer_url || null;
  const po = $('#pythonOpt');
  po.disabled = !VIEWER_URL; po.textContent = VIEWER_URL ? `python viewer (${VIEWER_URL})` : 'python viewer (not running)';
  if (first) {
    // Prefer the python viewer when it exists and this page can embed it.
    if (VIEWER_URL && !(location.protocol === 'https:' && VIEWER_URL.startsWith('http:'))) $('#viewerKind').value = 'python';
    updateHint(); showEmbedded();
  }
  render();
  status(`${Object.keys(DATASETS).length} dataset(s) · version ${idx.version}`);
}

function bounds(ds, key) {
  // heuristic slider ranges from the source dtype
  const dt = ds.source_dtype || 'uint8';
  if (/uint8/.test(dt)) return [0, 255, 1];
  if (/uint16/.test(dt)) return [0, 65535, 1];
  if (/int/.test(dt)) return [0, 4294967295, 1];
  return [0, 1, 0.001];
}

function paramControl(ds, opIdx, key, schema, value, control = null) {
  const wrap = document.createElement('div'); wrap.className = 'param';
  const label = document.createElement('label'); label.textContent = key; label.title = schema.description || ''; wrap.appendChild(label);
  const types = [].concat(schema.type || (schema.anyOf||[]).map(a=>a.type)).filter(Boolean);
  const isNum = types.includes('number') || types.includes('integer');
  if (isNum) {
    const [lo, hi, step] = control ? [control.min, control.max, control.step ?? 'any'] : bounds(ds, key);
    const range = document.createElement('input'); range.type='range'; range.min=lo; range.max=hi; range.step=step;
    const num = document.createElement('input'); num.type='number'; num.step=step;
    const v = (value===null||value===undefined) ? '' : value; range.value = v || lo; num.value = v;
    const commit = (val, final) => { range.value = val; num.value = val; setParam(ds.name, opIdx, key, val===''? null : Number(val), final, !!control); };
    range.oninput = () => commit(range.value, false);     // live: PUT (debounced); python viewer follows
    range.onchange = () => commit(range.value, true);     // release: also navigate external viewers
    num.onchange = () => commit(num.value, true);
    wrap.appendChild(range); wrap.appendChild(num);
  } else if (types.includes('boolean')) {
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = !!value;
    cb.onchange = () => setParam(ds.name, opIdx, key, cb.checked, true, !!control);
    wrap.appendChild(cb); wrap.appendChild(document.createElement('span'));
  } else {
    const t = document.createElement('input'); t.type='text'; t.value = value ?? '';
    t.onchange = () => setParam(ds.name, opIdx, key, t.value);
    wrap.appendChild(t); wrap.appendChild(document.createElement('span'));
  }
  if (schema.description) { const d = document.createElement('div'); d.className = 'desc'; d.textContent = schema.description; wrap.appendChild(d); }
  return wrap;
}

function render() {
  const main = $('#main');
  for (const el of [...main.querySelectorAll('.card.ds')]) el.remove();
  for (const [name, ds] of Object.entries(DATASETS)) {
    ds.name = name;
    const card = document.createElement('section'); card.className = 'card ds'; card.dataset.name = name;
    // built as text, not HTML: the name and source are whatever was sent to /api
    const h2 = document.createElement('h2'); h2.textContent = `${name} `;
    const small = document.createElement('small'); small.textContent = `${ds.levels[0].dtype} · ${ds.levels[0].shape.join('×')} · ${ds.levels.length} level(s)`; h2.appendChild(small);
    const src = document.createElement('div'); src.className = 'src'; src.textContent = `${ds.spec ? ds.spec.source : '(constructed in Python; not editable here)'} `;
    const digest = document.createElement('span'); digest.className = 'digest'; digest.textContent = `@${ds.digest}`; src.appendChild(digest);
    card.append(h2, src);
    if (!ds.spec) { main.appendChild(card); continue; }
    if (!ds.spec.ops.length) { const n = document.createElement('div'); n.className = 'opdoc'; n.textContent = 'No ops: this is the source exactly as stored. Add an op below to process it.'; card.appendChild(n); }
    ds.spec.ops.forEach((op, i) => {
      const box = document.createElement('div'); box.className = 'op';
      const head = document.createElement('div'); head.className = 'head';
      const info = (ds.ops_info || [])[i];
      const halo = info && info.halo && Math.max(...info.halo) > 0 ? ` · reads ${Math.max(...info.halo)} voxel${Math.max(...info.halo)>1?'s':''} of context on each side` : '';
      head.innerHTML = `<span><b>${op.op}</b><span class="hint">${halo}</span></span>`;
      const rm = document.createElement('button'); rm.textContent = 'remove'; rm.onclick = () => { DATASETS[name].spec.ops.splice(i,1); pendingFinal[name] = true; push(name, true); };  // the current spec: a push replaces DATASETS[name]
      head.appendChild(rm); box.appendChild(head);
      const doc = document.createElement('div'); doc.className = 'opdoc'; doc.textContent = (OPS[op.op]?.doc || '').split('\n')[0]; box.appendChild(doc);
      const props = OPS[op.op]?.schema?.properties || {};
      if (op.op === 'python') box.appendChild(codeEditor(ds, i, op));
      else for (const [key, schema] of Object.entries(props)) box.appendChild(paramControl(ds, i, key, schema, op[key] ?? schema.default));
      card.appendChild(box);
    });
    const row = document.createElement('div'); row.className = 'row';
    const sel = document.createElement('select');
    for (const opName of Object.keys(OPS)) { const o = document.createElement('option'); o.value = o.textContent = opName; sel.appendChild(o); }
    const add = document.createElement('button'); add.textContent = 'add op';
    add.onclick = () => { DATASETS[name].spec.ops.push({op: sel.value}); pendingFinal[name] = true; push(name, true); };
    row.appendChild(sel); row.appendChild(add);
    card.appendChild(row);
    main.appendChild(card);
  }
}

// A python op: its code, edited in place (PUT after a pause), and a slider for each of its
// #uicontrol lines, as the server read them (ops_info), rebuilt after each change.
function codeEditor(ds, i, op) {
  const wrap = document.createElement('div');
  const ta = document.createElement('textarea'); ta.className = 'code'; ta.spellcheck = false;
  ta.value = op.code ?? OPS.python.schema.properties.code.default;
  ta.onkeydown = e => {
    if (e.key === 'Tab') { e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); }
    if (e.key === '/' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); toggleComment(ta); }
  };
  ta.oninput = () => {
    DATASETS[ds.name].spec.ops[i].code = ta.value; pendingFinal[ds.name] = true;  // each PUT's answer is a new spec
    clearTimeout(timers[ds.name]); timers[ds.name] = setTimeout(() => push(ds.name), 600);
  };
  const err = document.createElement('div'); err.className = 'codeerr'; err.dataset.op = i;
  const sliders = document.createElement('div'); sliders.className = 'sliders'; sliders.dataset.op = i;
  const row = document.createElement('div'); row.className = 'row';
  const copy = document.createElement('button'); copy.textContent = 'copy as plugin';
  copy.onclick = async () => { await navigator.clipboard.writeText(pluginSource(ta.value)); status('copied: a module defining the op, for the chunkmirage.ops entry point'); };
  row.appendChild(copy);
  wrap.append(ta, err, sliders, row);
  fillSliders(ds, i, sliders);
  return wrap;
}


// Ctrl+/ (Cmd+/ on a Mac), as in VS Code: the selected lines (or the caret's) commented out,
// '# ' at their smallest indent, or uncommented when every one of them is a comment.
function toggleComment(ta) {
  const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  const start = v.lastIndexOf('\n', s - 1) + 1;
  const stop = v.indexOf('\n', e > s && v[e - 1] === '\n' ? e - 1 : e);
  const end = stop === -1 ? v.length : stop;
  const lines = v.slice(start, end).split('\n'), code = lines.filter(l => l.trim());
  if (!code.length) return;
  const off = code.every(l => /^\s*#/.test(l));
  const indent = Math.min(...code.map(l => l.length - l.trimStart().length));
  const out = lines.map(l => !l.trim() ? l : off ? l.replace(/^(\s*)# ?/, '$1') : l.slice(0, indent) + '# ' + l.slice(indent));
  ta.setRangeText(out.join('\n'), start, end, s === e ? 'preserve' : 'select');
  if (s === e) ta.selectionStart = ta.selectionEnd = Math.max(start, s + out[0].length - lines[0].length);
  ta.dispatchEvent(new Event('input'));
}

function fillSliders(ds, i, box) {
  box.replaceChildren();
  const op = ds.spec.ops[i];
  for (const c of ((ds.ops_info || [])[i] || {}).controls || []) {
    const schema = c.type === 'bool' ? {type: 'boolean'} : {type: 'number'};
    const el = paramControl(ds, i, c.name, schema, (op.params || {})[c.name] ?? c.default, c);
    box.appendChild(el);
  }
}

// What "copy as plugin" gives: a module whose op is this code, its sliders its parameters.
function pluginSource(code, name = 'my_op') {
  const cls = name.split('_').map(w => w[0].toUpperCase() + w.slice(1)).join('');
  const body = code.replace(/\\/g, '\\\\').replace(/'''/g, "\\'\\'\\'");
  return `# ${name}.py: an op made from code written for chunkmirage's python op. Register it in\n`
    + `# pyproject.toml:  [project.entry-points."chunkmirage.ops"]  ${name} = "${name}:${cls}"\n`
    + `from chunkmirage.ops import python_op\n\n${cls} = python_op("${name}", '''\\\n${body.endsWith('\n') ? body : body + '\n'}''')\n`;
}

let pendingFinal = {};
function setParam(name, opIdx, key, value, final=true, control=false) {
  const op = DATASETS[name].spec.ops[opIdx];
  if (control) op.params = {...(op.params || {}), [key]: value}; else op[key] = value;
  pendingFinal[name] = pendingFinal[name] || final;
  clearTimeout(timers[name]);
  timers[name] = setTimeout(() => push(name), 150);
}

let inflight = {};
async function push(name, rerender=false) {
  if (inflight[name]) { inflight[name] = 'again'; return; }   // coalesce; re-run after the current PUT
  inflight[name] = true;
  const ds = DATASETS[name];
  const final = pendingFinal[name] !== false; pendingFinal[name] = false;
  status(`updating ${name}…`);
  let body;
  try {
    const r = await api(`api/datasets/${encodeURIComponent(name)}`, {method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify(ds.spec)});
    body = await r.json();
    if (!r.ok) { status(`error: ${body.error}`); codeErrors(name, body.error); return; }
  } finally {
    const again = inflight[name] === 'again'; inflight[name] = false;
    if (again) { setTimeout(() => push(name, rerender), 0); }
  }
  DATASETS[name] = body; DATASETS[name].name = name;
  codeErrors(name, '');
  if (rerender) render(); else {
    const card = document.querySelector(`.card.ds[data-name="${CSS.escape(name)}"]`);
    if (card) {
      card.querySelector('.digest').textContent = `@${body.digest}`;
      card.querySelector('h2 small').textContent = `${body.levels[0].dtype} · ${body.levels[0].shape.join('×')} · ${body.levels.length} level(s)`;
      // the code box keeps its text and caret; its sliders follow its #uicontrol lines
      for (const box of card.querySelectorAll('.sliders')) fillSliders(DATASETS[name], Number(box.dataset.op), box);
      for (const [i, op] of body.spec.ops.entries()) if (op.op === 'python') { const ta = card.querySelectorAll('.op')[i]?.querySelector('textarea'); if (ta) op.code = ta.value; }
    }
  }
  status(`updated ${name} → @${body.digest}`);
  if ($('#autoPush').checked && final) pushViewer();
}

// A failed change's message under the code boxes of a dataset (its python ops' code is
// where most mistakes are): the pydantic wrapping trimmed off.
function codeErrors(name, error) {
  const text = (error || '').split('\n').filter(l => /Value error|Error|line \d/.test(l)).map(l => l.replace(/^\s*Value error, /, '').replace(/ \[type=.*$/, '')).join('\n') || error;
  for (const el of document.querySelectorAll(`.card.ds[data-name="${CSS.escape(name)}"] .codeerr`)) el.textContent = text;
}

let VIEWER_URL = null;   // python viewer, if the server reports one

function viewerKind() { return $('#viewerKind').value; }
function viewerBase() {
  const k = viewerKind();
  if (k === 'python') return VIEWER_URL;
  if (k === 'custom') return $('#viewerUrl').value;
  return 'https://neuroglancer-demo.appspot.com';
}

async function viewerLink() {
  const k = viewerKind();
  if (k === 'python') return VIEWER_URL;          // state lives server-side; the URL never changes
  const fmt = $('#format').value;
  const r = await api(`api/neuroglancer?format=${fmt}&viewer=${encodeURIComponent(viewerBase())}`);
  if (!r.ok) { status(r.status === 401 ? NO_TOKEN : `the viewer link failed: ${r.status}`); return null; }
  return (await r.json()).url;
}
// the token this page was opened with no longer works: none, or the server restarted with a new one
const NO_TOKEN = 'This page needs the server\'s token: open the "control UI" link the server printed (a restart makes a new one, unless started with --token).';

function updateHint() {
  const k = viewerKind(), pageHttps = location.protocol === 'https:';
  let msg = '';
  if (k === 'python') {
    msg = 'The python viewer keeps its own state: edits swap only the changed layer and your camera is preserved.';
    if (pageHttps && VIEWER_URL && VIEWER_URL.startsWith('http:'))
      msg += ' This page is https but the python viewer is http, so browsers refuse to embed it; use "Open in new tab".';
  } else {
    msg = 'External viewers cache by URL, so each update navigates the viewer to a new state URL. Its camera cannot be read back across origins and resets on every push.';
    if (!pageHttps && !['localhost','127.0.0.1'].includes(location.hostname))
      msg += ' Chunks are served over http from a non-localhost address; https viewers will block them (mixed content). Restart with --https.';
  }
  $('#viewerHint').textContent = msg;
}

async function showEmbedded() {
  const frame = $('#ngFrame');
  const k = viewerKind(), pageHttps = location.protocol === 'https:';
  const blocked = k === 'python' && pageHttps && VIEWER_URL && VIEWER_URL.startsWith('http:');
  if (!$('#embed').checked || (k === 'python' && !VIEWER_URL) || blocked) { frame.style.display = 'none'; frame.src = 'about:blank'; return; }
  const url = await viewerLink();
  if (frame.src !== url) frame.src = url;
  frame.style.display = 'block';
}

let pushTimer = null, lastPush = 0;
function pushViewer() {
  if (viewerKind() === 'python') return;          // syncs itself through the registry
  const wait = Math.max(0, 500 - (Date.now() - lastPush));
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    lastPush = Date.now();
    const url = await viewerLink();
    if (!url) return;
    if ($('#embed').checked && $('#ngFrame').style.display !== 'none') $('#ngFrame').src = url;   // camera resets (cross-origin)
    if (ngWin && !ngWin.closed) ngWin.location.href = url;
  }, wait);
}

$('#openViewer').onclick = async () => { const url = await viewerLink(); if (url) ngWin = window.open(url, 'chunkmirage-neuroglancer'); };
$('#viewerKind').onchange = () => { $('#viewerUrl').style.display = viewerKind() === 'custom' ? '' : 'none'; updateHint(); showEmbedded(); };
$('#viewerUrl').onchange = showEmbedded;
$('#format').onchange = showEmbedded;
$('#embed').onchange = showEmbedded;

// Live refresh when anything (curl, Python, another tab) edits a pipeline.
const es = new EventSource(TOKEN ? `api/events?token=${encodeURIComponent(TOKEN)}` : 'api/events');
es.addEventListener('change', async (ev) => {
  const data = JSON.parse(ev.data);
  if (Object.values(inflight).some(Boolean)) return;   // our own edit is in progress; push() handles it
  const changed = Object.entries(data.datasets).some(([n, d]) => !DATASETS[n] || DATASETS[n].digest !== d.digest)
               || Object.keys(DATASETS).length !== Object.keys(data.datasets).length;
  if (changed) { await load(); if ($('#autoPush').checked) pushViewer(); }
});
es.onerror = async () => {
  status('event stream disconnected; retrying…');
  // a token the server no longer takes keeps failing: say so once, and stop retrying
  const r = await api('api/datasets').catch(() => null);
  if (r && r.status === 401) { es.close(); status(NO_TOKEN); }
};
load();
</script>
</body>
</html>
