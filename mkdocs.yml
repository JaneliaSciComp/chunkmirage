site_name: chunkmirage
site_description: Spoof chunked array formats over HTTP with on-the-fly processing.
site_url: https://janeliascicomp.github.io/chunkmirage/
repo_url: https://github.com/JaneliaSciComp/chunkmirage
repo_name: chunkmirage
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: teal
      toggle: { icon: material/brightness-7, name: dark mode }
    - scheme: slate
      primary: teal
      toggle: { icon: material/brightness-4, name: light mode }

nav:
  - Home: index.md
  - Demos: demos.md
  - "Demo gallery (in your browser) ↗": https://janeliascicomp.github.io/chunkmirage/browser/
  - Getting started: getting-started.md
  - Concepts:
      - Architecture & design: design.md
      - Pipelines, ops and halos: concepts/pipelines.md
      - Caching: concepts/caching.md
      - Interactivity: concepts/interactivity.md
      - Formats and URLs: concepts/formats.md
  - Reference:
      - Ops: reference/ops.md
      - REST API: reference/api.md
      - Python API: reference/python.md
      - CLI: reference/cli.md
  - FAQ: faq.md
  - Roadmap: roadmap.md
  - Contributing & doc policy: contributing.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            docstring_style: google
            members_order: source
